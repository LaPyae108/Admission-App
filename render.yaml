# ============================================================
# Render Blueprint
#
# This file goes at the REPO ROOT (/workspaces/Admission-App/
# render.yaml), same level as .github/ - NOT inside my_project.
#
# rootDir below is what tells Render your actual Flask app
# lives one folder down, in my_project/.
#
# To deploy: go to Render -> New -> Blueprint -> connect this
# repo. Render reads this file and sets everything up. You'll
# be prompted to paste in your Neon DATABASE_URL during setup
# (sync: false means Render asks for it directly - the value
# is never written into this file or committed to git).
# ============================================================

services:
  - type: web
    name: admission-app
    runtime: python
    rootDir: my_project
    plan: starter
    region: singapore

    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Auto-generated by Render - a real random 256-bit
      # value, replacing the "a-very-secret-secret" fallback
      # in config.py. You'll never need to touch this.
      - key: SECRET_KEY
        generateValue: true

      # Prompted for during setup, stored only in Render's
      # dashboard - never written here or committed.
      # Use your Neon POOLED connection string (the one with
      # -pooler in the hostname) for this one, since it's the
      # app's normal day-to-day traffic - same as your local
      # .env's DATABASE_URL.
      - key: DATABASE_URL
        sync: false