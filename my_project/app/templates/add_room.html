<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles_for_teachers.css') }}"
    >

    <title>
        Add Room
    </title>

</head>

<body>

<div class="layout">


    <!-- =========================================================
         SIDEBAR
         ========================================================= -->

    <aside class="sidebar">

        <div class="logo">

            <h2>
                School Admin
            </h2>

            <p>
                Administration Portal
            </p>

        </div>


        <nav class="navigation">

            <a
                href="{{ url_for('main.dashboard') }}"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('main.dashboard') }}"
                class="nav-link"
            >
                Students
            </a>

            <a
                href="{{ url_for('main.teachers_ui') }}"
                class="nav-link"
            >
                Teachers
            </a>

            <a
                href="{{ url_for('main.attendance_overview') }}"
                class="nav-link"
            >
                Attendance
            </a>

            <a
                href="{{ url_for('main.room_assign') }}"
                class="nav-link active"
            >
                Room Assign
            </a>

        </nav>

    </aside>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    Add Room
                </h1>

                <p>
                    Register a new teaching room
                </p>

            </div>

            <div style="display:flex; align-items:center; gap:12px;">

                <span style="font-weight:600;">
                    {{ current_user.username }}
                </span>

                <form
                    method="POST"
                    action="{{ url_for('main.logout') }}"
                    style="margin:0;"
                >
                    <button
                        type="submit"
                        style="padding:7px 13px; background:#fff; border:1px solid #d8dee8; border-radius:6px; color:#374151; font-size:13px; font-weight:600; cursor:pointer;"
                    >
                        Logout
                    </button>
                </form>

            </div>

        </header>


        <section class="content">

            <div class="form-section">

                <div class="form-section-header">

                    <h3>
                        Room Details
                    </h3>

                    <p>
                        Rooms added here become available to
                        assign to courses on the Room Assign
                        page.
                    </p>

                </div>


                {% if error %}

                    <div class="error-message">
                        {{ error }}
                    </div>

                {% endif %}


                <form
                    method="POST"
                    action="{{ url_for('main.add_room') }}"
                    class="add-teacher-form"
                >

                    <div class="form-group">

                        <label for="name">
                            Room Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="e.g. Room 101"
                            value="{{ form_data.get('name', '') }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="capacity">
                            Information
                        </label>

                        <input
                            type="text"
                            id="capacity"
                            name="capacity"
                            placeholder="Optional"
                            value="{{ form_data.get('capacity', '') }}"
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="notes">
                            Notes
                        </label>

                        <textarea
                            id="notes"
                            name="notes"
                            rows="2"
                            placeholder="Optional - e.g. 'Has a projector', 'Ground floor'"
                        >{{ form_data.get('notes', '') }}</textarea>

                    </div>


                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Add Room
                    </button>

                </form>

            </div>

        </section>

    </main>

</div>

</body>
</html>
